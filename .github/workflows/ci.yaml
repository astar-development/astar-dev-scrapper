name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore AStar.Dev.Web.Scrapper.slnx

      - name: Build
        run: dotnet build AStar.Dev.Web.Scrapper.slnx --no-restore --configuration Release
